name: Analyze Version Change

on:
  workflow_dispatch:
  repository_dispatch:
    types: [analyze-connector-changes]

jobs:
  analyze:
    name: Analyze connector version changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate complete git diff
        id: diff
        run: |
          echo "Generating complete diff between master and correct-auto-generate-connector branches..."
          echo "📁 Files to analyze: ballerina/client.bal and ballerina/types.bal ONLY"
          echo ""

          # Generate COMPLETE diff for ONLY client.bal and types.bal
          # These are the two files that contain:
          #   - client.bal: Public API methods and remote functions
          #   - types.bal: Type definitions, records, and enums
          # No truncation - we'll send the FULL content to Claude in chunks
          git diff origin/master...origin/correct-auto-generate-connector \
            --unified=5 \
            -- ballerina/client.bal ballerina/types.bal > git_diff.txt

          # Check if diff is not empty
          if [ ! -s git_diff.txt ]; then
            echo "❌ No changes detected in client.bal or types.bal"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Get diff statistics
          DIFF_SIZE=$(wc -c < git_diff.txt)
          DIFF_LINES=$(wc -l < git_diff.txt)

          echo "✅ Complete diff generated successfully"
          echo "📏 Size: $DIFF_SIZE bytes ($DIFF_LINES lines)"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "diff_size=$DIFF_SIZE" >> $GITHUB_OUTPUT
          echo "diff_lines=$DIFF_LINES" >> $GITHUB_OUTPUT

          # Show first 100 lines as preview
          echo ""
          echo "📋 Diff Preview (first 100 lines):"
          echo "================================"
          head -n 100 git_diff.txt
          echo "================================"
          echo "... (${DIFF_LINES} total lines)"

      - name: Set up Ballerina
        if: steps.diff.outputs.has_changes == 'true'
        uses: ballerina-platform/setup-ballerina@v1.1.0
        with:
          version: latest

      - name: Run multi-turn analysis
        if: steps.diff.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts

          echo "🤖 Starting multi-turn version change analysis..."
          echo "📊 Diff statistics:"
          echo "   - Size: ${{ steps.diff.outputs.diff_size }} bytes"
          echo "   - Lines: ${{ steps.diff.outputs.diff_lines }}"
          echo ""
          echo "📦 The diff will be split into chunks and sent to Claude"
          echo "   in a conversational manner to ensure complete analysis."
          echo ""

          # Run the enhanced Ballerina script with multi-turn support
          bal run analyze_version_change.bal -- "../git_diff.txt"

          # Move result to root for easier access
          mv analysis_result.json ../

      - name: Display results
        if: always() && steps.diff.outputs.has_changes == 'true'
        run: |
          if [ -f analysis_result.json ]; then
            echo "📊 Analysis Results:"
            echo "==================="
            cat analysis_result.json | jq '.'

            # Extract key information
            CHANGE_TYPE=$(jq -r '.changeType' analysis_result.json)
            CONFIDENCE=$(jq -r '.confidence' analysis_result.json)

            echo ""
            echo "🔖 Recommended Version Bump: $CHANGE_TYPE"
            echo "✅ Confidence Score: $CONFIDENCE"
          else
            echo "⚠️ No analysis result found"
          fi

      - name: Upload analysis results
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: version-analysis
          path: |
            analysis_result.json
            git_diff.txt
          retention-days: 30

      - name: Create enhanced PR comment
        if: github.event_name == 'repository_dispatch' && steps.diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('analysis_result.json')) {
              console.log('❌ No analysis result found');
              return;
            }

            const analysis = JSON.parse(fs.readFileSync('analysis_result.json', 'utf8'));
            const diffSize = '${{ steps.diff.outputs.diff_size }}';
            const diffLines = '${{ steps.diff.outputs.diff_lines }}';

            // Determine emoji and color based on change type
            const changeTypeEmoji = {
              'MAJOR': '🔴',
              'MINOR': '🟡',
              'PATCH': '🟢'
            };

            const emoji = changeTypeEmoji[analysis.changeType] || '⚪';

            // Build comment
            let comment = `## ${emoji} Version Change Analysis (Multi-Turn Analysis)\n\n`;
            comment += `| Metric | Value |\n`;
            comment += `|--------|-------|\n`;
            comment += `| **Recommended Version Bump** | \`${analysis.changeType}\` |\n`;
            comment += `| **Confidence Score** | ${(analysis.confidence * 100).toFixed(1)}% |\n`;
            comment += `| **Diff Size** | ${diffSize} bytes (${diffLines} lines) |\n`;
            comment += `| **Analysis Method** | Multi-turn (Complete diff analyzed) |\n`;
            comment += `\n`;

            comment += `### 📝 Summary\n${analysis.summary}\n\n`;

            if (analysis.breakingChanges && analysis.breakingChanges.length > 0) {
              comment += `### ⚠️ Breaking Changes\n`;
              analysis.breakingChanges.forEach(change => {
                comment += `- ${change}\n`;
              });
              comment += '\n';
            }

            if (analysis.newFeatures && analysis.newFeatures.length > 0) {
              comment += `### ✨ New Features\n`;
              analysis.newFeatures.forEach(feature => {
                comment += `- ${feature}\n`;
              });
              comment += '\n';
            }

            if (analysis.bugFixes && analysis.bugFixes.length > 0) {
              comment += `### 🐛 Bug Fixes & Improvements\n`;
              analysis.bugFixes.forEach(fix => {
                comment += `- ${fix}\n`;
              });
              comment += '\n';
            }

            // Add interpretation guide
            comment += `---\n`;
            comment += `<details>\n`;
            comment += `<summary>📚 Version Bump Guidelines</summary>\n\n`;
            comment += `- **MAJOR (🔴)**: Breaking changes that require users to update their code\n`;
            comment += `- **MINOR (🟡)**: New features added in a backward-compatible manner\n`;
            comment += `- **PATCH (🟢)**: Bug fixes and improvements with no API changes\n`;
            comment += `\n`;
            comment += `*This analysis was performed using multi-turn AI analysis with the complete diff content sent in chunks.*\n`;
            comment += `</details>\n`;

            // Post comment to PR
            const prNumber = context.payload.client_payload?.pr_number;

            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
              console.log(`✅ Posted analysis to PR #${prNumber}`);
            } else {
              console.log('⚠️ No PR number provided in payload');
              console.log('Comment that would have been posted:');
              console.log(comment);
            }

      - name: Set job summary
        if: always() && steps.diff.outputs.has_changes == 'true'
        run: |
          if [ -f analysis_result.json ]; then
            CHANGE_TYPE=$(jq -r '.changeType' analysis_result.json)
            CONFIDENCE=$(jq -r '.confidence' analysis_result.json)
            SUMMARY=$(jq -r '.summary' analysis_result.json)

            echo "## 📊 Version Change Analysis (Multi-Turn)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Recommended Version Bump:** \`$CHANGE_TYPE\`" >> $GITHUB_STEP_SUMMARY
            echo "**Confidence:** $CONFIDENCE" >> $GITHUB_STEP_SUMMARY
            echo "**Analysis Method:** Complete diff analyzed using multi-turn conversation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Summary" >> $GITHUB_STEP_SUMMARY
            echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Update version in gradle.properties
        if: steps.diff.outputs.has_changes == 'true'
        id: version_update
        run: |
          if [ ! -f analysis_result.json ]; then
            echo "❌ No analysis result found, skipping version update"
            exit 1
          fi

          CHANGE_TYPE=$(jq -r '.changeType' analysis_result.json)
          echo "📦 Recommended change type: $CHANGE_TYPE"

          # Checkout the correct-auto-generate-connector branch
          git fetch origin correct-auto-generate-connector
          git checkout correct-auto-generate-connector

          # Read current version from gradle.properties
          CURRENT_VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          echo "📌 Current version: $CURRENT_VERSION"

          # Remove -SNAPSHOT suffix if present for parsing
          BASE_VERSION=$(echo "$CURRENT_VERSION" | sed 's/-SNAPSHOT//')

          # Parse version components
          MAJOR=$(echo "$BASE_VERSION" | cut -d'.' -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d'.' -f2)
          PATCH=$(echo "$BASE_VERSION" | cut -d'.' -f3)

          echo "   Major: $MAJOR, Minor: $MINOR, Patch: $PATCH"

          # Calculate new version based on change type
          case "$CHANGE_TYPE" in
            "MAJOR")
              NEW_MAJOR=$((MAJOR + 1))
              NEW_VERSION="${NEW_MAJOR}.0.0"
              ;;
            "MINOR")
              NEW_MINOR=$((MINOR + 1))
              NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
              ;;
            "PATCH")
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
              ;;
            *)
              echo "❌ Unknown change type: $CHANGE_TYPE"
              exit 1
              ;;
          esac

          echo "🔖 New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "change_type=$CHANGE_TYPE" >> $GITHUB_OUTPUT

          # Update gradle.properties
          sed -i "s/^version=.*/version=${NEW_VERSION}-SNAPSHOT/" gradle.properties

          echo "✅ Updated gradle.properties:"
          grep '^version=' gradle.properties

      - name: Run Gradle build to update Ballerina files
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          echo "🔨 Running Gradle build to update Ballerina.toml and Dependencies.toml..."

          # Run the Gradle build task that updates the Ballerina files
          ./gradlew :twilio-ballerina:updateTomlFile

          echo ""
          echo "📄 Updated Ballerina.toml:"
          cat ballerina/Ballerina.toml

          echo ""
          echo "📄 Updated Dependencies.toml:"
          cat ballerina/Dependencies.toml || echo "Dependencies.toml not found or unchanged"

      - name: Run bal build
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          echo "🔨 Running bal build to verify and finalize dependencies..."
          cd ballerina
          bal build --skip-tests

          echo ""
          echo "✅ Build completed successfully"
          echo ""
          echo "📄 Final Ballerina.toml:"
          cat Ballerina.toml

          echo ""
          echo "📄 Final Dependencies.toml:"
          cat Dependencies.toml

      - name: Commit and push version changes
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_VERSION="${{ steps.version_update.outputs.new_version }}"
          CHANGE_TYPE="${{ steps.version_update.outputs.change_type }}"

          git add gradle.properties ballerina/Ballerina.toml ballerina/Dependencies.toml
          git commit -m "Bump version to ${NEW_VERSION}-SNAPSHOT (${CHANGE_TYPE} change)"
          git push origin correct-auto-generate-connector

          echo "✅ Version changes committed and pushed"
          echo ""
          echo "🔖 New version: ${NEW_VERSION}-SNAPSHOT"
          echo "📝 Change type: ${CHANGE_TYPE}"
