name: Analyze Version Change

on:
  workflow_dispatch:
  repository_dispatch:
    types: [analyze-connector-changes]

jobs:
  analyze:
    name: Analyze connector version changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: correct-auto-generate-connector

      - name: Generate complete git diff
        id: diff
        run: |
          echo "Generating complete diff between master and correct-auto-generate-connector branches..."
          echo "📁 Files to analyze: ballerina/client.bal and ballerina/types.bal ONLY"
          echo ""

          git diff origin/master...origin/correct-auto-generate-connector \
            --unified=5 \
            -- ballerina/client.bal ballerina/types.bal > git_diff.txt

          if [ ! -s git_diff.txt ]; then
            echo "❌ No changes detected in client.bal or types.bal"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          DIFF_SIZE=$(wc -c < git_diff.txt)
          DIFF_LINES=$(wc -l < git_diff.txt)

          echo "✅ Complete diff generated successfully"
          echo "📏 Size: $DIFF_SIZE bytes ($DIFF_LINES lines)"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "diff_size=$DIFF_SIZE" >> $GITHUB_OUTPUT
          echo "diff_lines=$DIFF_LINES" >> $GITHUB_OUTPUT

          echo ""
          echo "📋 Diff Preview (first 100 lines):"
          echo "================================"
          head -n 100 git_diff.txt
          echo "================================"
          echo "... (${DIFF_LINES} total lines)"

      - name: Set up Ballerina
        if: steps.diff.outputs.has_changes == 'true'
        uses: ballerina-platform/setup-ballerina@v1.1.0
        with:
          version: latest

      - name: Run multi-turn analysis
        if: steps.diff.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts

          echo "🤖 Starting multi-turn version change analysis..."
          echo "📊 Diff statistics:"
          echo "   - Size: ${{ steps.diff.outputs.diff_size }} bytes"
          echo "   - Lines: ${{ steps.diff.outputs.diff_lines }}"
          echo ""
          echo "📦 The diff will be split into chunks and sent to Claude"
          echo "   in a conversational manner to ensure complete analysis."
          echo ""

          bal run analyze_version_change.bal -- "../git_diff.txt"

          mv analysis_result.json ../

          echo "✅ Analysis complete"

      - name: Update version files
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          echo "📝 Updating version based on AI analysis..."

          CHANGE_TYPE=$(jq -r '.changeType' analysis_result.json)
          echo "🔖 Change type: $CHANGE_TYPE"

          CURRENT_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | sed 's/-SNAPSHOT//')
          echo "📌 Current version: $CURRENT_VERSION"

          MAJOR=$(echo $CURRENT_VERSION | cut -d'.' -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d'.' -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d'.' -f3)

          if [ "$CHANGE_TYPE" = "MAJOR" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$CHANGE_TYPE" = "MINOR" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$CHANGE_TYPE" = "PATCH" ]; then
            PATCH=$((PATCH + 1))
          else
            echo "❌ Invalid change type: $CHANGE_TYPE"
            exit 1
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "🆕 New version: $NEW_VERSION"

          sed -i "s/^version=.*/version=${NEW_VERSION}-SNAPSHOT/" gradle.properties
          echo "✅ Updated gradle.properties"

          sed -i "s/^version = .*/version = \"${NEW_VERSION}\"/" ballerina/Ballerina.toml
          echo "✅ Updated ballerina/Ballerina.toml"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "change_type=$CHANGE_TYPE" >> $GITHUB_OUTPUT
        id: version_bump

      - name: Build Ballerina project
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          echo "🔨 Building Ballerina project to regenerate Dependencies.toml..."
          cd ballerina
          bal build
          echo "✅ Build complete - Dependencies.toml updated"

      - name: Commit version changes
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add gradle.properties ballerina/Ballerina.toml ballerina/Dependencies.toml
          git commit -m "Bump version to ${{ steps.version_bump.outputs.new_version }} (${{ steps.version_bump.outputs.change_type }})"
          git push origin correct-auto-generate-connector

          echo "✅ Version files committed and pushed"

      - name: Display results
        if: always() && steps.diff.outputs.has_changes == 'true'
        run: |
          if [ -f analysis_result.json ]; then
            echo "📊 Analysis Results:"
            echo "==================="
            cat analysis_result.json | jq '.'

            CHANGE_TYPE=$(jq -r '.changeType' analysis_result.json)
            CONFIDENCE=$(jq -r '.confidence' analysis_result.json)

            echo ""
            echo "🔖 Recommended Version Bump: $CHANGE_TYPE"
            echo "🆕 New Version: ${{ steps.version_bump.outputs.new_version }}"
            echo "✅ Confidence Score: $CONFIDENCE"
          else
            echo "⚠️ No analysis result found"
          fi

      - name: Upload analysis results
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: version-analysis
          path: |
            analysis_result.json
            git_diff.txt
          retention-days: 30

      - name: Create enhanced PR comment
        if: github.event_name == 'repository_dispatch' && steps.diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('analysis_result.json')) {
              console.log('❌ No analysis result found');
              return;
            }

            const analysis = JSON.parse(fs.readFileSync('analysis_result.json', 'utf8'));
            const diffSize = '${{ steps.diff.outputs.diff_size }}';
            const diffLines = '${{ steps.diff.outputs.diff_lines }}';
            const newVersion = '${{ steps.version_bump.outputs.new_version }}';

            const changeTypeEmoji = {
              'MAJOR': '🔴',
              'MINOR': '🟡',
              'PATCH': '🟢'
            };

            const emoji = changeTypeEmoji[analysis.changeType] || '⚪';

            let comment = `## ${emoji} Version Change Analysis\n\n`;
            comment += `| Metric | Value |\n`;
            comment += `|--------|-------|\n`;
            comment += `| **Recommended Version Bump** | \`${analysis.changeType}\` |\n`;
            comment += `| **New Version** | \`${newVersion}\` |\n`;
            comment += `| **Confidence Score** | ${(analysis.confidence * 100).toFixed(1)}% |\n`;
            comment += `| **Diff Size** | ${diffSize} bytes (${diffLines} lines) |\n`;
            comment += `\n`;

            comment += `### 📝 Summary\n${analysis.summary}\n\n`;

            if (analysis.breakingChanges && analysis.breakingChanges.length > 0) {
              comment += `### ⚠️ Breaking Changes\n`;
              analysis.breakingChanges.forEach(change => {
                comment += `- ${change}\n`;
              });
              comment += '\n';
            }

            if (analysis.newFeatures && analysis.newFeatures.length > 0) {
              comment += `### ✨ New Features\n`;
              analysis.newFeatures.forEach(feature => {
                comment += `- ${feature}\n`;
              });
              comment += '\n';
            }

            if (analysis.bugFixes && analysis.bugFixes.length > 0) {
              comment += `### 🐛 Bug Fixes & Improvements\n`;
              analysis.bugFixes.forEach(fix => {
                comment += `- ${fix}\n`;
              });
              comment += '\n';
            }

            comment += `### 📦 Updated Files\n`;
            comment += `- \`gradle.properties\`: \`${newVersion}-SNAPSHOT\`\n`;
            comment += `- \`ballerina/Ballerina.toml\`: \`${newVersion}\`\n`;
            comment += `- \`ballerina/Dependencies.toml\`: regenerated\n\n`;

            comment += `---\n`;
            comment += `<details>\n`;
            comment += `<summary>📚 Version Bump Guidelines</summary>\n\n`;
            comment += `- **MAJOR (🔴)**: Breaking changes\n`;
            comment += `- **MINOR (🟡)**: New features (backward-compatible)\n`;
            comment += `- **PATCH (🟢)**: Bug fixes only\n`;
            comment += `</details>\n`;

            const prNumber = context.payload.client_payload?.pr_number;

            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
              console.log(`✅ Posted analysis to PR #${prNumber}`);
            } else {
              console.log('⚠️ No PR number provided');
              console.log(comment);
            }

      - name: Set job summary
        if: always() && steps.diff.outputs.has_changes == 'true'
        run: |
          if [ -f analysis_result.json ]; then
            CHANGE_TYPE=$(jq -r '.changeType' analysis_result.json)
            CONFIDENCE=$(jq -r '.confidence' analysis_result.json)
            SUMMARY=$(jq -r '.summary' analysis_result.json)
            NEW_VERSION="${{ steps.version_bump.outputs.new_version }}"

            echo "## 📊 Version Change Analysis" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Version Bump:** \`$CHANGE_TYPE\` → \`$NEW_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "**Confidence:** $CONFIDENCE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Summary" >> $GITHUB_STEP_SUMMARY
            echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Files Updated" >> $GITHUB_STEP_SUMMARY
            echo "- gradle.properties" >> $GITHUB_STEP_SUMMARY
            echo "- ballerina/Ballerina.toml" >> $GITHUB_STEP_SUMMARY
            echo "- ballerina/Dependencies.toml" >> $GITHUB_STEP_SUMMARY
          fi
